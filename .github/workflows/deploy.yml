# Builds and deploys to Cloudflare Pages by direct upload.
# Uses one Cloudflare API token, scoped to this Pages project only, stored as the repository
# secret CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions). No Cloudflare GitHub
# app is installed. Revoke the token in Cloudflare to stop all deploys immediately.
#
# Until launch the whole site sits behind Cloudflare Access, so a deployment is never public.
# While the site has TODO items, deploy the preview build (the production build refuses to run).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}   # set this repository variable once Cloudflare is set up
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run ${{ vars.BUILD_SCRIPT || 'build:preview' }}
      - name: Deploy
        run: npx wrangler@4 pages deploy dist --project-name=classic-leasing --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
