<svg xmlns="http://www.w3.org/2000/svg" class="clf clf-narrow" viewBox="0 0 360 452" width="360" height="452" role="img" aria-labelledby="clf04nt clf04nd"><title id="clf04nt">What one deduction covers</title><desc id="clf04nd">A single deduction each pay cycle covers the lease rental and builds a running-cost fund. A portion of the deduction comes out before tax.</desc><style>
  .clf-narrow .clf-s{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:1.6;stroke-linecap:square}
  .clf-narrow .clf-h{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:0.9}
  .clf-narrow .clf-r{stroke:var(--cl-rule,#D6D0C4);fill:none;stroke-width:0.9}
  .clf-narrow .clf-ox{fill:var(--cl-oxide,#A8431A)}
  .clf-narrow .clf-oxs{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:1.6}
  .clf-narrow .clf-oxh{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:0.9}
  .clf-narrow .clf-oxf{fill:var(--cl-oxide,#A8431A);stroke:var(--cl-oxide,#A8431A);stroke-width:1.6}
  .clf-narrow text{font-family:Arial,Helvetica,'Liberation Sans',sans-serif;fill:var(--cl-ink,#1C1A17);font-variant-numeric:tabular-nums}
  .clf-narrow .clf-eb{font-size:11.5px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
  .clf-narrow .clf-ebo{font-size:11.5px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-oxide,#A8431A)}
  .clf-narrow .clf-lb{font-size:17px;font-weight:700}
  .clf-narrow .clf-md{font-size:16px}
  .clf-narrow .clf-sb{font-size:14.5px;fill:var(--cl-muted,#5A544A)}
  .clf-narrow .clf-nt{font-size:15px}
  .clf-narrow .clf-cp{font-size:11px;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
</style><text class="clf-eb" x="180" y="28" text-anchor="middle">A PORTION COMES OUT BEFORE TAX</text><path class="clf-h" d="M16 52 V40 H344 V52"/><rect class="clf-s" x="16" y="64" width="328" height="56"/><text class="clf-lb" x="180" y="98" text-anchor="middle">One deduction</text><path class="clf-s" d="M36 120 V184 M36 150 V254"/><rect class="clf-s" x="60" y="158" width="284" height="52"/><text class="clf-lb" x="202" y="190" text-anchor="middle">Lease rental</text><path class="clf-s" d="M36 184 H60"/><rect class="clf-oxs" x="60" y="228" width="284" height="52"/><text class="clf-lb" x="202" y="260" text-anchor="middle">Running-cost fund</text><path class="clf-s" d="M36 254 H60"/><text class="clf-sb" x="60" y="302">fuel, servicing, tyres, registration and</text><text class="clf-sb" x="60" y="320">insurance</text><text class="clf-sb" x="16" y="350">Proportions vary. The bars are not to scale.</text><text class="clf-cp" x="344" y="382" text-anchor="end">FIG. 04</text><path class="clf-h" d="M16 390 H344"/><text class="clf-nt" x="16" y="414">How much is pre-tax depends on your</text><text class="clf-nt" x="16" y="434">circumstances, and we set it out in your quote.</text></svg>