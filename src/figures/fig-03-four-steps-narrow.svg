<svg xmlns="http://www.w3.org/2000/svg" class="clf clf-narrow" viewBox="0 0 360 466" width="360" height="466" role="img" aria-labelledby="clf03nt clf03nd"><title id="clf03nt">Four steps, and the car stays where it is</title><desc id="clf03nd">Four steps: we agree a value, we buy it, your employer novates the lease, you keep driving. Ownership changes at step two; the car does not move.</desc><style>
  .clf-narrow .clf-s{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:1.6;stroke-linecap:square}
  .clf-narrow .clf-h{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:0.9}
  .clf-narrow .clf-r{stroke:var(--cl-rule,#D6D0C4);fill:none;stroke-width:0.9}
  .clf-narrow .clf-ox{fill:var(--cl-oxide,#A8431A)}
  .clf-narrow .clf-oxs{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:1.6}
  .clf-narrow .clf-oxh{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:0.9}
  .clf-narrow .clf-oxf{fill:var(--cl-oxide,#A8431A);stroke:var(--cl-oxide,#A8431A);stroke-width:1.6}
  .clf-narrow text{font-family:Arial,Helvetica,'Liberation Sans',sans-serif;fill:var(--cl-ink,#1C1A17);font-variant-numeric:tabular-nums}
  .clf-narrow .clf-eb{font-size:11.5px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
  .clf-narrow .clf-ebo{font-size:11.5px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-oxide,#A8431A)}
  .clf-narrow .clf-lb{font-size:17px;font-weight:700}
  .clf-narrow .clf-md{font-size:16px}
  .clf-narrow .clf-sb{font-size:14.5px;fill:var(--cl-muted,#5A544A)}
  .clf-narrow .clf-nt{font-size:15px}
  .clf-narrow .clf-cp{font-size:11px;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
</style><text class="clf-eb" x="48" y="32">STEP 1</text><text class="clf-eb" x="344" y="32" text-anchor="end">YOU OWN IT</text><text class="clf-lb" x="48" y="56">We agree a value</text><text class="clf-sb" x="48" y="76">what it’s worth, agreed with you</text><text class="clf-eb" x="48" y="108">STEP 2</text><text class="clf-ebo" x="344" y="108" text-anchor="end">WE OWN IT</text><text class="clf-lb" x="48" y="132">We buy it</text><text class="clf-sb" x="48" y="152">we pay you that value</text><text class="clf-eb" x="48" y="184">STEP 3</text><text class="clf-lb" x="48" y="208">Your employer novates</text><text class="clf-sb" x="48" y="228">a deduction each pay cycle</text><text class="clf-eb" x="48" y="260">STEP 4</text><text class="clf-lb" x="48" y="284">You keep driving</text><text class="clf-sb" x="48" y="304">service it where you always have</text><path class="clf-s" d="M24 36 V292"/><path class="clf-h" d="M18 50 H30"/><path class="clf-oxs" d="M12 126 H36"/><path class="clf-h" d="M18 202 H30"/><path class="clf-h" d="M18 278 H30"/><rect class="clf-s" x="16" y="336" width="328" height="44"/><text class="clf-lb" x="180" y="363" text-anchor="middle">The car stays where it is</text><text class="clf-cp" x="344" y="416" text-anchor="end">FIG. 03</text><path class="clf-h" d="M16 424 H344"/><text class="clf-nt" x="16" y="448">Four steps, and the car stays where it is.</text></svg>