<svg xmlns="http://www.w3.org/2000/svg" class="clf clf-narrow" viewBox="0 0 360 410" width="360" height="410" role="img" aria-labelledby="clf07nt clf07nd"><title id="clf07nt">Why running costs are generally net of GST</title><desc id="clf07nd">You pay a bill including GST; your employer claims the input tax credit; your budget is charged the cost net of GST.</desc><style>
  .clf-narrow .clf-s{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:1.6;stroke-linecap:square}
  .clf-narrow .clf-h{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:0.9}
  .clf-narrow .clf-r{stroke:var(--cl-rule,#D6D0C4);fill:none;stroke-width:0.9}
  .clf-narrow .clf-ox{fill:var(--cl-oxide,#A8431A)}
  .clf-narrow .clf-oxs{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:1.6}
  .clf-narrow .clf-oxh{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:0.9}
  .clf-narrow .clf-oxf{fill:var(--cl-oxide,#A8431A);stroke:var(--cl-oxide,#A8431A);stroke-width:1.6}
  .clf-narrow text{font-family:Arial,Helvetica,'Liberation Sans',sans-serif;fill:var(--cl-ink,#1C1A17);font-variant-numeric:tabular-nums}
  .clf-narrow .clf-eb{font-size:11.5px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
  .clf-narrow .clf-ebo{font-size:11.5px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-oxide,#A8431A)}
  .clf-narrow .clf-lb{font-size:17px;font-weight:700}
  .clf-narrow .clf-md{font-size:16px}
  .clf-narrow .clf-sb{font-size:14.5px;fill:var(--cl-muted,#5A544A)}
  .clf-narrow .clf-nt{font-size:15px}
  .clf-narrow .clf-cp{font-size:11px;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
</style><text class="clf-eb" x="16" y="28">RUNNING COSTS ARE GENERALLY</text><text class="clf-eb" x="16" y="44">NET OF GST</text><rect class="clf-s" x="16" y="64" width="328" height="64"/><text class="clf-lb" x="180.0" y="94.0" text-anchor="middle">You pay a bill</text><text class="clf-sb" x="180.0" y="116.0" text-anchor="middle">including GST</text><path class="clf-s" d="M180 128 V152"/><rect class="clf-s" x="16" y="152" width="328" height="64"/><text class="clf-lb" x="180.0" y="182.0" text-anchor="middle">Your employer</text><text class="clf-sb" x="180.0" y="204.0" text-anchor="middle">claims the input tax credit</text><path class="clf-s" d="M180 216 V240"/><rect class="clf-oxs" x="16" y="240" width="328" height="64"/><text class="clf-lb" x="180.0" y="270.0" text-anchor="middle">Your budget</text><text class="clf-sb" x="180.0" y="292.0" text-anchor="middle">is charged the cost net of GST</text><text class="clf-cp" x="344" y="340" text-anchor="end">FIG. 07</text><path class="clf-h" d="M16 348 H344"/><text class="clf-nt" x="16" y="372">The input tax credits are claimable by your</text><text class="clf-nt" x="16" y="392">employer.</text></svg>