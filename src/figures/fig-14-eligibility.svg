<svg xmlns="http://www.w3.org/2000/svg" class="clf clf-wide" viewBox="0 0 900 344" width="900" height="344" role="img" aria-labelledby="clf14wt clf14wd"><title id="clf14wt">Three outcomes from the checker</title><desc id="clf14wd">Five questions about the car return one of three answers: looks eligible, needs a conversation, or outside our criteria.</desc><style>
  .clf-wide .clf-s{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:1.6;stroke-linecap:square}
  .clf-wide .clf-h{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:0.9}
  .clf-wide .clf-r{stroke:var(--cl-rule,#D6D0C4);fill:none;stroke-width:0.9}
  .clf-wide .clf-ox{fill:var(--cl-oxide,#A8431A)}
  .clf-wide .clf-oxs{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:1.6}
  .clf-wide .clf-oxh{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:0.9}
  .clf-wide .clf-oxf{fill:var(--cl-oxide,#A8431A);stroke:var(--cl-oxide,#A8431A);stroke-width:1.6}
  .clf-wide text{font-family:Arial,Helvetica,'Liberation Sans',sans-serif;fill:var(--cl-ink,#1C1A17);font-variant-numeric:tabular-nums}
  .clf-wide .clf-eb{font-size:11px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
  .clf-wide .clf-ebo{font-size:11px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-oxide,#A8431A)}
  .clf-wide .clf-lb{font-size:17px;font-weight:700}
  .clf-wide .clf-md{font-size:15px}
  .clf-wide .clf-sb{font-size:13.5px;fill:var(--cl-muted,#5A544A)}
  .clf-wide .clf-nt{font-size:15px}
  .clf-wide .clf-cp{font-size:11px;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
</style><path class="clf-s" d="M56 160 H360"/><path class="clf-s" d="M56 146 V174"/><text class="clf-eb" x="56" y="134">FIVE QUESTIONS</text><path class="clf-s" d="M360 160 H392"/><path class="clf-s" d="M392 160 V96 H436"/><path class="clf-oxs" d="M392 160 H436"/><path class="clf-s" d="M392 160 V224 H436"/><path class="clf-h" d="M436 88 V104 M436 216 V232"/><path class="clf-oxh" d="M436 152 V168"/><text class="clf-lb" x="452" y="92">Looks eligible</text><text class="clf-sb" x="452" y="112">your car fits our criteria; the next step is a quote</text><text class="clf-lb" x="452" y="156">Needs a conversation</text><text class="clf-sb" x="452" y="176">outside one of our criteria, but that doesn’t settle it</text><text class="clf-lb" x="452" y="220">Outside our criteria</text><text class="clf-sb" x="452" y="240">we tell you which rule it fell outside, and why</text><path class="clf-h" d="M56 306 H844"/><text class="clf-nt" x="56" y="330">The rules are a starting point and a car that warrants a closer look gets one.</text><text class="clf-cp" x="844" y="330" text-anchor="end">FIG. 14</text></svg>