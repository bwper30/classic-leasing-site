<svg xmlns="http://www.w3.org/2000/svg" class="clf clf-narrow" viewBox="0 0 360 458" width="360" height="458" role="img" aria-labelledby="clf13nt clf13nd"><title id="clf13nt">A lease is not a loan</title><desc id="clf13nd">Compared across four rows: who owns the car, what you pay, what happens at the end, and whether you are borrowing.</desc><style>
  .clf-narrow .clf-s{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:1.6;stroke-linecap:square}
  .clf-narrow .clf-h{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:0.9}
  .clf-narrow .clf-r{stroke:var(--cl-rule,#D6D0C4);fill:none;stroke-width:0.9}
  .clf-narrow .clf-ox{fill:var(--cl-oxide,#A8431A)}
  .clf-narrow .clf-oxs{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:1.6}
  .clf-narrow .clf-oxh{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:0.9}
  .clf-narrow .clf-oxf{fill:var(--cl-oxide,#A8431A);stroke:var(--cl-oxide,#A8431A);stroke-width:1.6}
  .clf-narrow text{font-family:Arial,Helvetica,'Liberation Sans',sans-serif;fill:var(--cl-ink,#1C1A17);font-variant-numeric:tabular-nums}
  .clf-narrow .clf-eb{font-size:11.5px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
  .clf-narrow .clf-ebo{font-size:11.5px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-oxide,#A8431A)}
  .clf-narrow .clf-lb{font-size:17px;font-weight:700}
  .clf-narrow .clf-md{font-size:16px}
  .clf-narrow .clf-sb{font-size:14.5px;fill:var(--cl-muted,#5A544A)}
  .clf-narrow .clf-nt{font-size:15px}
  .clf-narrow .clf-cp{font-size:11px;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
</style><text class="clf-eb" x="16" y="28">IF YOU BORROWED</text><text class="clf-ebo" x="184" y="28">WITH US</text><path class="clf-h" d="M16 40 H168"/><path class="clf-oxs" d="M184 40 H344"/><text class="clf-sb" x="16" y="70">Who owns the car</text><text class="clf-md" x="16" y="94">You do</text><text class="clf-md" x="184" y="94">We do</text><path class="clf-r" d="M16 110 H344"/><text class="clf-sb" x="16" y="138">What you pay</text><text class="clf-md" x="16" y="162">Repayments with</text><text class="clf-md" x="16" y="183">interest</text><text class="clf-md" x="184" y="162">A lease rental</text><path class="clf-r" d="M16 199 H344"/><text class="clf-sb" x="16" y="227">At the end</text><text class="clf-md" x="16" y="251">You own it outright</text><text class="clf-md" x="184" y="251">There’s a residual to</text><text class="clf-md" x="184" y="272">settle</text><path class="clf-r" d="M16 288 H344"/><text class="clf-sb" x="16" y="316">Are you borrowing</text><text class="clf-md" x="16" y="340">Yes</text><text class="clf-md" x="184" y="340">No</text><text class="clf-cp" x="344" y="388" text-anchor="end">FIG. 13</text><path class="clf-h" d="M16 396 H344"/><text class="clf-nt" x="16" y="420">It isn’t interest and you aren’t borrowing. We own</text><text class="clf-nt" x="16" y="440">the car and we’re leasing it to you.</text></svg>