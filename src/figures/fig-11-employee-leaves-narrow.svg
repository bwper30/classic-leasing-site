<svg xmlns="http://www.w3.org/2000/svg" class="clf clf-narrow" viewBox="0 0 360 398" width="360" height="398" role="img" aria-labelledby="clf11nt clf11nd"><title id="clf11nt">When the employee leaves</title><desc id="clf11nd">The novation ends, deductions stop, the balance is refunded through payroll and taxed on the way out, and the lease returns to the employee.</desc><style>
  .clf-narrow .clf-s{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:1.6;stroke-linecap:square}
  .clf-narrow .clf-h{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:0.9}
  .clf-narrow .clf-r{stroke:var(--cl-rule,#D6D0C4);fill:none;stroke-width:0.9}
  .clf-narrow .clf-ox{fill:var(--cl-oxide,#A8431A)}
  .clf-narrow .clf-oxs{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:1.6}
  .clf-narrow .clf-oxh{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:0.9}
  .clf-narrow .clf-oxf{fill:var(--cl-oxide,#A8431A);stroke:var(--cl-oxide,#A8431A);stroke-width:1.6}
  .clf-narrow text{font-family:Arial,Helvetica,'Liberation Sans',sans-serif;fill:var(--cl-ink,#1C1A17);font-variant-numeric:tabular-nums}
  .clf-narrow .clf-eb{font-size:11.5px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
  .clf-narrow .clf-ebo{font-size:11.5px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-oxide,#A8431A)}
  .clf-narrow .clf-lb{font-size:17px;font-weight:700}
  .clf-narrow .clf-md{font-size:16px}
  .clf-narrow .clf-sb{font-size:14.5px;fill:var(--cl-muted,#5A544A)}
  .clf-narrow .clf-nt{font-size:15px}
  .clf-narrow .clf-cp{font-size:11px;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
</style><text class="clf-md" x="48" y="32">The novation ends</text><text class="clf-md" x="48" y="68">Your deductions stop</text><text class="clf-sb" x="48" y="88">obligations stop too</text><text class="clf-md" x="48" y="124">The balance is refunded through payroll</text><text class="clf-sb" x="48" y="144">taxed on the way out</text><path class="clf-oxs" d="M12 176 H344"/><text class="clf-ebo" x="344" y="198" text-anchor="end">YOUR INVOLVEMENT ENDS HERE</text><text class="clf-md" x="48" y="232">The lease goes back to the employee</text><text class="clf-sb" x="48" y="252">they deal with us</text><path class="clf-s" d="M24 15 V239"/><path class="clf-h" d="M18 27 H30"/><path class="clf-h" d="M18 63 H30"/><path class="clf-h" d="M18 119 H30"/><path class="clf-h" d="M18 227 H30"/><text class="clf-cp" x="344" y="288" text-anchor="end">FIG. 11</text><path class="clf-h" d="M16 296 H344"/><text class="clf-nt" x="16" y="320">The novation ends. Your deductions stop and</text><text class="clf-nt" x="16" y="340">your obligations stop with them. Anything left in</text><text class="clf-nt" x="16" y="360">the balance is refunded through payroll, and</text><text class="clf-nt" x="16" y="380">taxed on the way out.</text></svg>