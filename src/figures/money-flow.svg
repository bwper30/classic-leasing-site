<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440"
     role="img" aria-labelledby="ttl dsc" font-family="Arial, Helvetica, sans-serif">
  <title id="ttl">How the money moves</title>
  <desc id="dsc">Three amounts are paid into your vehicle fund each pay cycle: a pre-tax
  deduction, a post-tax deduction, and the GST credits on your running costs. The fund pays the
  lease rental, maintenance and repairs, fuel, insurance, registration and tyres.</desc>

  <style>
    :root{}
    .ink{fill:#1C1A17}.muted{fill:#5A544A}.oxide{fill:#A8431A}
    .card{fill:#FFFFFF;stroke:#D6D0C4;stroke-width:1}
    .fund{fill:#FFFFFF;stroke:#1C1A17;stroke-width:2}
    .flowin{stroke:#A8431A;stroke-width:2;fill:none}
    .flowout{stroke:#5A544A;stroke-width:1.5;fill:none}
    .lbl{font-size:13px;font-weight:700}
    .sub{font-size:11.5px}
    .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.4px}
    @media (prefers-color-scheme: dark){
      .ink{fill:#E8E3D8}.muted{fill:#A79F93}.oxide{fill:#D98E3C}
      .card{fill:#24211D;stroke:#3A352F}
      .fund{fill:#24211D;stroke:#E8E3D8}
      .flowin{stroke:#D98E3C}.flowout{stroke:#A79F93}
    }
  </style>

  <defs>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A8431A"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A544A"/>
    </marker>
  </defs>

  <!-- employer -->
  <rect class="card" x="16" y="150" width="150" height="140" rx="2"/>
  <text class="eyebrow oxide" x="32" y="180">EACH PAY CYCLE</text>
  <text class="lbl ink" x="32" y="206">Your employer</text>
  <text class="sub muted" x="32" y="228">deducts an agreed</text>
  <text class="sub muted" x="32" y="244">amount from your pay</text>
  <text class="sub muted" x="32" y="260">and passes it on</text>

  <!-- inflow arrows -->
  <path class="flowin" marker-end="url(#ai)" d="M166 186 H 372"/>
  <path class="flowin" marker-end="url(#ai)" d="M166 220 H 372"/>
  <path class="flowin" marker-end="url(#ai)" d="M166 254 H 372"/>

  <text class="sub ink" x="186" y="178">A portion before tax</text>
  <text class="sub ink" x="186" y="212">A portion after tax</text>
  <text class="sub ink" x="186" y="246">GST credits on running costs</text>

  <!-- fund -->
  <rect class="fund" x="380" y="128" width="196" height="184" rx="2"/>
  <text class="eyebrow oxide" x="400" y="160">YOUR VEHICLE FUND</text>
  <text class="sub muted" x="400" y="188">The money accumulates</text>
  <text class="sub muted" x="400" y="206">whether or not you</text>
  <text class="sub muted" x="400" y="224">spend it that month.</text>
  <text class="sub muted" x="400" y="252">You claim against</text>
  <text class="sub muted" x="400" y="270">what is in it.</text>

  <!-- outflow fan -->
  <path class="flowout" marker-end="url(#ao)" d="M576 220 C 640 220, 640 46, 706 46"/>
  <path class="flowout" marker-end="url(#ao)" d="M576 220 C 640 220, 640 110, 706 110"/>
  <path class="flowout" marker-end="url(#ao)" d="M576 220 C 640 220, 640 174, 706 174"/>
  <path class="flowout" marker-end="url(#ao)" d="M576 220 C 640 220, 640 238, 706 238"/>
  <path class="flowout" marker-end="url(#ao)" d="M576 220 C 640 220, 640 302, 706 302"/>
  <path class="flowout" marker-end="url(#ao)" d="M576 220 C 640 220, 640 366, 706 366"/>

  <text class="lbl ink" x="718" y="51">Lease rental</text>
  <text class="lbl ink" x="718" y="115">Maintenance and repairs</text>
  <text class="lbl ink" x="718" y="179">Fuel</text>
  <text class="lbl ink" x="718" y="243">Insurance</text>
  <text class="lbl ink" x="718" y="307">Registration</text>
  <text class="lbl ink" x="718" y="371">Tyres</text>

  <text class="sub muted" x="718" y="404">Anything left over stays in the fund.</text>
</svg>
