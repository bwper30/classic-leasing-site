<svg xmlns="http://www.w3.org/2000/svg" class="clf clf-wide" viewBox="0 0 900 372" width="900" height="372" role="img" aria-labelledby="clf02wt clf02wd"><title id="clf02wt">The three parties</title><desc id="clf02wd">Your employer sits above; the lease runs between you and Classic Leasing; a novation agreement binds all three.</desc><style>
  .clf-wide .clf-s{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:1.6;stroke-linecap:square}
  .clf-wide .clf-h{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:0.9}
  .clf-wide .clf-r{stroke:var(--cl-rule,#D6D0C4);fill:none;stroke-width:0.9}
  .clf-wide .clf-ox{fill:var(--cl-oxide,#A8431A)}
  .clf-wide .clf-oxs{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:1.6}
  .clf-wide .clf-oxh{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:0.9}
  .clf-wide .clf-oxf{fill:var(--cl-oxide,#A8431A);stroke:var(--cl-oxide,#A8431A);stroke-width:1.6}
  .clf-wide text{font-family:Arial,Helvetica,'Liberation Sans',sans-serif;fill:var(--cl-ink,#1C1A17);font-variant-numeric:tabular-nums}
  .clf-wide .clf-eb{font-size:11px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
  .clf-wide .clf-ebo{font-size:11px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-oxide,#A8431A)}
  .clf-wide .clf-lb{font-size:17px;font-weight:700}
  .clf-wide .clf-md{font-size:15px}
  .clf-wide .clf-sb{font-size:13.5px;fill:var(--cl-muted,#5A544A)}
  .clf-wide .clf-nt{font-size:15px}
  .clf-wide .clf-cp{font-size:11px;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
</style><text class="clf-ebo" x="40" y="32">NOVATION AGREEMENT — THE THREE OF US</text><rect class="clf-oxs" x="40" y="44" width="820" height="244" rx="3"/><rect class="clf-s" x="350" y="76" width="200" height="68"/><text class="clf-lb" x="450" y="108" text-anchor="middle">Your employer</text><text class="clf-sb" x="450" y="130" text-anchor="middle">deducts from your pay</text><rect class="clf-s" x="88" y="200" width="200" height="68"/><text class="clf-lb" x="188" y="232" text-anchor="middle">You</text><text class="clf-sb" x="188" y="254" text-anchor="middle">drive the car</text><rect class="clf-s" x="612" y="200" width="200" height="68"/><text class="clf-lb" x="712" y="232" text-anchor="middle">Classic Leasing</text><text class="clf-sb" x="712" y="254" text-anchor="middle">owns the car</text><path class="clf-s" d="M288 234 H612"/><text class="clf-eb" x="380" y="258" text-anchor="middle">THE LEASE</text><path class="clf-s" d="M450 144 V234"/><text class="clf-sb" x="462" y="180">passes on the rental</text><path class="clf-h" d="M56 334 H844"/><text class="clf-nt" x="56" y="358">The lease is between you and us. Your employer’s obligation ends when your employment does.</text><text class="clf-cp" x="844" y="358" text-anchor="end">FIG. 02</text></svg>