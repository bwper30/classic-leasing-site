<svg xmlns="http://www.w3.org/2000/svg" class="clf clf-wide" viewBox="0 0 900 356" width="900" height="356" role="img" aria-labelledby="clf04wt clf04wd"><title id="clf04wt">What one deduction covers</title><desc id="clf04wd">A single deduction each pay cycle covers the lease rental and builds a running-cost fund. A portion of the deduction comes out before tax.</desc><style>
  .clf-wide .clf-s{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:1.6;stroke-linecap:square}
  .clf-wide .clf-h{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:0.9}
  .clf-wide .clf-r{stroke:var(--cl-rule,#D6D0C4);fill:none;stroke-width:0.9}
  .clf-wide .clf-ox{fill:var(--cl-oxide,#A8431A)}
  .clf-wide .clf-oxs{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:1.6}
  .clf-wide .clf-oxh{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:0.9}
  .clf-wide .clf-oxf{fill:var(--cl-oxide,#A8431A);stroke:var(--cl-oxide,#A8431A);stroke-width:1.6}
  .clf-wide text{font-family:Arial,Helvetica,'Liberation Sans',sans-serif;fill:var(--cl-ink,#1C1A17);font-variant-numeric:tabular-nums}
  .clf-wide .clf-eb{font-size:11px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
  .clf-wide .clf-ebo{font-size:11px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-oxide,#A8431A)}
  .clf-wide .clf-lb{font-size:17px;font-weight:700}
  .clf-wide .clf-md{font-size:15px}
  .clf-wide .clf-sb{font-size:13.5px;fill:var(--cl-muted,#5A544A)}
  .clf-wide .clf-nt{font-size:15px}
  .clf-wide .clf-cp{font-size:11px;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
</style><path class="clf-h" d="M56 112 V100 H356 V112"/><text class="clf-eb" x="206" y="88" text-anchor="middle">A PORTION COMES OUT BEFORE TAX</text><rect class="clf-s" x="56" y="132" width="300" height="60"/><text class="clf-lb" x="206" y="168" text-anchor="middle">One deduction</text><rect class="clf-s" x="560" y="96" width="284" height="60"/><text class="clf-lb" x="702" y="132" text-anchor="middle">Lease rental</text><rect class="clf-oxs" x="560" y="176" width="284" height="60"/><text class="clf-lb" x="702" y="212" text-anchor="middle">Running-cost fund</text><path class="clf-s" d="M356 162 H460"/><path class="clf-s" d="M460 162 V126 H560"/><path class="clf-s" d="M460 162 V206 H560"/><text class="clf-sb" x="560" y="258">fuel, servicing, tyres, registration and insurance</text><text class="clf-sb" x="56" y="216">Proportions vary. The bars are not to scale.</text><path class="clf-h" d="M56 318 H844"/><text class="clf-nt" x="56" y="342">How much is pre-tax depends on your circumstances, and we set it out in your quote.</text><text class="clf-cp" x="844" y="342" text-anchor="end">FIG. 04</text></svg>