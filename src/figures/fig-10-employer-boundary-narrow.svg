<svg xmlns="http://www.w3.org/2000/svg" class="clf clf-narrow" viewBox="0 0 360 390" width="360" height="390" role="img" aria-labelledby="clf10nt clf10nd"><title id="clf10nt">What you take on, and what you don’t</title><desc id="clf10nd">The employer operates a deduction and carries the FBT liability; they do not take on the vehicle, residual risk, a fee, or any obligation after the employment ends.</desc><style>
  .clf-narrow .clf-s{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:1.6;stroke-linecap:square}
  .clf-narrow .clf-h{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:0.9}
  .clf-narrow .clf-r{stroke:var(--cl-rule,#D6D0C4);fill:none;stroke-width:0.9}
  .clf-narrow .clf-ox{fill:var(--cl-oxide,#A8431A)}
  .clf-narrow .clf-oxs{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:1.6}
  .clf-narrow .clf-oxh{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:0.9}
  .clf-narrow .clf-oxf{fill:var(--cl-oxide,#A8431A);stroke:var(--cl-oxide,#A8431A);stroke-width:1.6}
  .clf-narrow text{font-family:Arial,Helvetica,'Liberation Sans',sans-serif;fill:var(--cl-ink,#1C1A17);font-variant-numeric:tabular-nums}
  .clf-narrow .clf-eb{font-size:11.5px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
  .clf-narrow .clf-ebo{font-size:11.5px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-oxide,#A8431A)}
  .clf-narrow .clf-lb{font-size:17px;font-weight:700}
  .clf-narrow .clf-md{font-size:16px}
  .clf-narrow .clf-sb{font-size:14.5px;fill:var(--cl-muted,#5A544A)}
  .clf-narrow .clf-nt{font-size:15px}
  .clf-narrow .clf-cp{font-size:11px;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
</style><text class="clf-eb" x="16" y="28">YOU TAKE ON</text><text class="clf-md" x="16" y="60">A payroll deduction each cycle</text><text class="clf-md" x="16" y="88">Remitting it to us</text><text class="clf-md" x="16" y="116">The FBT liability, as with any novated lease</text><path class="clf-oxs" d="M16 134 H344"/><text class="clf-eb" x="16" y="168">YOU DON’T TAKE ON</text><text class="clf-md" x="16" y="200">The vehicle</text><text class="clf-md" x="16" y="228">Residual risk</text><text class="clf-md" x="16" y="256">Any fee — there is none to you</text><text class="clf-md" x="16" y="284">Any obligation once the employment ends</text><text class="clf-cp" x="344" y="320" text-anchor="end">FIG. 10</text><path class="clf-h" d="M16 328 H344"/><text class="clf-nt" x="16" y="352">You aren’t lending anything, guaranteeing</text><text class="clf-nt" x="16" y="372">anything, or taking on an asset.</text></svg>