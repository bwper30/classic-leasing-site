<svg xmlns="http://www.w3.org/2000/svg" class="clf clf-narrow" viewBox="0 0 360 366" width="360" height="366" role="img" aria-labelledby="clf14nt clf14nd"><title id="clf14nt">Three outcomes from the checker</title><desc id="clf14nd">Five questions about the car return one of three answers: looks eligible, needs a conversation, or outside our criteria.</desc><style>
  .clf-narrow .clf-s{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:1.6;stroke-linecap:square}
  .clf-narrow .clf-h{stroke:var(--cl-ink,#1C1A17);fill:none;stroke-width:0.9}
  .clf-narrow .clf-r{stroke:var(--cl-rule,#D6D0C4);fill:none;stroke-width:0.9}
  .clf-narrow .clf-ox{fill:var(--cl-oxide,#A8431A)}
  .clf-narrow .clf-oxs{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:1.6}
  .clf-narrow .clf-oxh{stroke:var(--cl-oxide,#A8431A);fill:none;stroke-width:0.9}
  .clf-narrow .clf-oxf{fill:var(--cl-oxide,#A8431A);stroke:var(--cl-oxide,#A8431A);stroke-width:1.6}
  .clf-narrow text{font-family:Arial,Helvetica,'Liberation Sans',sans-serif;fill:var(--cl-ink,#1C1A17);font-variant-numeric:tabular-nums}
  .clf-narrow .clf-eb{font-size:11.5px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
  .clf-narrow .clf-ebo{font-size:11.5px;font-weight:700;letter-spacing:0.14em;fill:var(--cl-oxide,#A8431A)}
  .clf-narrow .clf-lb{font-size:17px;font-weight:700}
  .clf-narrow .clf-md{font-size:16px}
  .clf-narrow .clf-sb{font-size:14.5px;fill:var(--cl-muted,#5A544A)}
  .clf-narrow .clf-nt{font-size:15px}
  .clf-narrow .clf-cp{font-size:11px;letter-spacing:0.14em;fill:var(--cl-muted,#5A544A)}
</style><path class="clf-s" d="M12 40 H36"/><text class="clf-eb" x="48" y="46">FIVE QUESTIONS</text><text class="clf-lb" x="52" y="92">Looks eligible</text><text class="clf-sb" x="52" y="112">your car fits our criteria; the next step is a</text><text class="clf-sb" x="52" y="130">quote</text><text class="clf-lb" x="52" y="164">Needs a conversation</text><text class="clf-sb" x="52" y="184">outside one of our criteria, but that doesn’t</text><text class="clf-sb" x="52" y="202">settle it</text><text class="clf-lb" x="52" y="236">Outside our criteria</text><text class="clf-sb" x="52" y="256">we tell you which rule it fell outside, and why</text><path class="clf-s" d="M24 40 V240"/><path class="clf-s" d="M24 96 H40"/><path class="clf-h" d="M40 88 V104"/><path class="clf-oxs" d="M24 168 H40"/><path class="clf-oxh" d="M40 160 V176"/><path class="clf-s" d="M24 240 H40"/><path class="clf-h" d="M40 232 V248"/><text class="clf-cp" x="344" y="296" text-anchor="end">FIG. 14</text><path class="clf-h" d="M16 304 H344"/><text class="clf-nt" x="16" y="328">The rules are a starting point and a car that</text><text class="clf-nt" x="16" y="348">warrants a closer look gets one.</text></svg>