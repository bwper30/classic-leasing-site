<svg xmlns="http://www.w3.org/2000/svg" class="clf clf-narrow" viewBox="0 0 360 456" width="360" height="456" role="img" aria-labelledby="clf08nt clf08nd"><title id="clf08nt">Depreciation on an older car is a smaller number</title><desc id="clf08nd">A curve of value against age: steep in the early years, much flatter later, which is where these cars sit.</desc><style>
