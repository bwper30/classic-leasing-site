<svg xmlns="http://www.w3.org/2000/svg" class="clf clf-wide" viewBox="0 0 900 284" width="900" height="284" role="img" aria-labelledby="clf07wt clf07wd"><title id="clf07wt">Why running costs are generally net of GST</title><desc id="clf07wd">You pay a bill including GST; your employer claims the input tax credit; your budget is charged the cost net of GST.</desc><style>
